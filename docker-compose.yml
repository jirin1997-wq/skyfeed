version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: skyfeed-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: skyfeed
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skyfeed-api
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/skyfeed
      PORT: 3001
      NODE_ENV: development
      FRONTEND_URL: http://localhost:3000
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev

volumes:
  postgres_data:

# Usage:
# docker-compose up
# 
# Services will be available at:
# - PostgreSQL: localhost:5432
# - Backend: http://localhost:3001
# - Frontend: http://localhost:3000
